<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Záchranný svatební plán</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #faf9f6; color: #1a1a1a; min-height: 100vh; padding: 2rem 1rem 4rem; }
  .container { max-width: 680px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid #e8e3d8; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 600; color: #1a1a1a; letter-spacing: -0.5px; margin-bottom: 0.4rem; }
  header p { font-size: 14px; color: #888; }
  .progress-wrap { background: #eee8dc; border-radius: 3px; height: 4px; margin: 1.5rem 0 0.5rem; overflow: hidden; }
  .progress-fill { height: 100%; background: #b5936e; border-radius: 3px; transition: width 0.4s ease; }
  .progress-label { font-size: 12px; color: #aaa; text-align: right; }
  .stats { display: flex; gap: 12px; margin: 1.5rem 0 2rem; }
  .stat { flex: 1; background: #fff; border: 1px solid #ede7d9; border-radius: 10px; padding: 14px; text-align: center; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 26px; color: #1a1a1a; }
  .stat-label { font-size: 11px; color: #999; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .section { margin-bottom: 2rem; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
  .section-icon { font-size: 18px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 600; color: #1a1a1a; flex: 1; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .badge-urgent { background: #fdecea; color: #c0392b; }
  .badge-dnes { background: #fef6e4; color: #a0680a; }
  .badge-jutro { background: #e8f0fe; color: #2558c4; }
  .badge-sobota { background: #e8f5e9; color: #2e7d32; }
  .badge-done { background: #e8f5e9; color: #2e7d32; }
  .tasks { background: #fff; border: 1px solid #ede7d9; border-radius: 12px; overflow: hidden; }
  .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f5f0e8; transition: background 0.15s; user-select: none; }
  .task:last-child { border-bottom: none; }
  .task:hover { background: #faf7f2; }
  .task.done { opacity: 0.4; }
  .task.done .task-label { text-decoration: line-through; }
  .cb { width: 20px; height: 20px; border: 1.5px solid #d4c8b0; border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .task.done .cb { background: #b5936e; border-color: #b5936e; }
  .task-body { flex: 1; }
  .task-label { font-size: 14px; color: #1a1a1a; line-height: 1.4; font-weight: 500; }
  .task-note { font-size: 12px; color: #999; margin-top: 3px; line-height: 1.4; }
  .save-indicator { text-align: center; font-size: 12px; color: #b5936e; min-height: 20px; margin-top: 1rem; transition: opacity 0.5s; }
  footer { text-align: center; margin-top: 2rem; font-size: 12px; color: #bbb; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Záchranný svatební plán 💍</h1>
    <p>Bílý Potok → louka &nbsp;·&nbsp; 20–50 hostů &nbsp;·&nbsp; sobota</p>
    <div class="progress-wrap"><div class="progress-fill" id="pbar" style="width:0%"></div></div>
    <div class="progress-label" id="pct-label">0 % splněno</div>
  </header>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="done-count">0</div><div class="stat-label">hotovo</div></div>
    <div class="stat"><div class="stat-num" id="total-count">0</div><div class="stat-label">celkem</div></div>
    <div class="stat"><div class="stat-num" id="pct">0 %</div><div class="stat-label">splněno</div></div>
  </div>
  <div id="checklist"></div>
  <div class="save-indicator" id="save-ind"></div>
  <footer>Vytvořeno s láskou pro záchrannou svatební misi 💍</footer>
</div>
<script>
const STORAGE_KEY = 'svatebni_plan_v1';

const data = [
  { title:"Obřad – logistika & průběh", icon:"💍", badge:"urgent", badgeLabel:"dnes vyřeš!", tasks:[
    { id:"ob1", label:"Kdo vede Nelu k oltáři?", note:"Domluvit konkrétně – kdo, jak rychle, jakou cestou. Nacvičit v pátek?" },
    { id:"ob2", label:"Pořadí příchodu: Lukáš a ty jdete první + hudba", note:"Potvrdit s oddávajícím. Jaká písnička hraje při vašem příchodu vs. při příchodu nevěsty?" },
    { id:"ob3", label:"Hudba na obřad – konkrétní skladby a kdy hrají", note:"Příchod hostů / příchod ženicha+svědka / příchod nevěsty / podpisy / odchod. Kdo spouští?" },
    { id:"ob4", label:"Repráky na obřad – odkud hudba?", note:"Bluetooth reproduktor spojený s mobilem. Kdo má repráky, kdo má playlist, kdo bude u telefonu?" },
    { id:"ob5", label:"Oltář – kde přesně stojí a kdo ho připraví", note:"Stůl na podpisy + propisky (min. 2!) u oltáře. Kdo donese a postaví?" },
    { id:"ob6", label:"Židle pro hosty na obřad", note:"Kolik? Kdo přiveze? Kdo je rozestaví před obřadem?" },
    { id:"ob7", label:"Parkování v Bílém Potoce", note:"Kde mohou hosté parkovat? Napsat info do skupiny před sobotou." },
  ]},
  { title:"Přípravy nevěsty – ranní organizace", icon:"👰", badge:"dnes", badgeLabel:"domluvit dnes", tasks:[
    { id:"nel1", label:"Kde bude Nela ráno před obřadem?", note:"Adresa, čas příjezdu, kdo u ní bude." },
    { id:"nel2", label:"Kdo bude s Nelou (přípravy, podpora)?", note:"Jedna pověřená osoba, co ji neopustí a hlídá čas." },
    { id:"nel3", label:"Kdo vítá hosty na místě obřadu?", note:"Jiná osoba než ta, co je s Nelou. Potvrdit kdo to je." },
    { id:"nel4", label:"Mýrty před obřadem – co přesně?", note:"Upřesnit: rituál s myrtem? Kdy, kde, kdo se účastní?" },
  ]},
  { title:"Foto & video", icon:"📷", badge:"urgent", badgeLabel:"dnes vyřeš!", tasks:[
    { id:"f1", label:"Fotograf – kdo a je potvrzen?", note:"Profesionál nebo kamarád s dobrým foťákem. Říct mu harmonogram." },
    { id:"f2", label:"Házení kytice – bude? Kdy a kde?", note:"Po obřadu nebo po jídle? Kdo organizuje? Fotograf ať je připraven." },
    { id:"f3", label:"Skupinové foto všech hostů", note:"Určit místo a čas – hned po obřadu, než se rozprchnou." },
  ]},
  { title:"Slavení na louce", icon:"🌿", badge:"jutro", badgeLabel:"zítra", tasks:[
    { id:"sl1", label:"Zasedací pořádek – bude nebo volné sezení?", note:"Pokud zasedací: připravit jmenovky. Kdo to udělá?" },
    { id:"sl2", label:"Proslovy – kdo, v jakém pořadí, kdy?", note:"Domluvit s řečníky předem. Tipované pořadí: rodiče, svědci, přátelé." },
    { id:"sl3", label:"Nůžky – na co? (dort, stuha…)", note:"Připravit a mít u ruky. Kdo má na starosti?" },
    { id:"sl4", label:"Hudba na louce – playlist + repráky", note:"Jiný playlist než na obřad? Kdo spravuje hudbu během slavení?" },
    { id:"sl5", label:"Odjezd novomanželů – jak a kam?", note:"Auto? Dekorace auta? Kdo připraví a kdy?" },
  ]},
  { title:"Dekorace & výzdoba", icon:"🌸", badge:"jutro", badgeLabel:"zítra", tasks:[
    { id:"d1", label:"Ubrusy / prostírání", note:"Bílé prostěradlo jako nouzový ubrus funguje. Nebo barevné piknikové deky." },
    { id:"d2", label:"Světýlka / svíčky / dekorace", note:"Ikea, zahradní centrum, nebo zapůjčit od rodiny." },
    { id:"d3", label:"Cedule / jmenovky / foto koutek", note:"Jednoduchá kartonová cedule + fix. Stačí!" },
  ]},
  { title:"Den D – sobotní ráno", icon:"☀️", badge:"sobota", badgeLabel:"sobota", tasks:[
    { id:"s1", label:"Vzbudit Nelu včas + dát jí snídani", note:"Nejdůležitější bod celého checklistu." },
    { id:"s2", label:"Zkontrolovat počasí + záloha (stan?)", note:"Prémiový stan na půjčení i poslední chvíli." },
    { id:"s3", label:"Nákup čerstvých věcí (pečivo, ovoce, led)", note:"Albert, Kaufland – otevřeno ráno." },
    { id:"s4", label:"Nabít mobily + powerbanky", note:"Fotky, navigace, hudba, platby – vše závisí na baterce." },
    { id:"s5", label:"Taška nevěsty (doklady, prsteny, kytice)", note:"Jedna fyzická taška se vším důležitým = jistota." },
  ]},
  { title:"Už vyřešeno ✓", icon:"✅", badge:"done", badgeLabel:"hotovo", tasks:[
    { id:"x1", label:"Kytice na obřad", note:"" },
    { id:"x2", label:"Stoly a catering", note:"" },
    { id:"x3", label:"Dort", note:"" },
  ]},
];

const badgeClass = { urgent:"badge-urgent", dnes:"badge-dnes", jutro:"badge-jutro", sobota:"badge-sobota", done:"badge-done" };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { x1: true, x2: true, x3: true };
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  const ind = document.getElementById('save-ind');
  ind.style.opacity = '1';
  ind.textContent = '✓ Uloženo';
  setTimeout(() => { ind.style.opacity = '0'; }, 1500);
}

let state = loadState();

function render() {
  const cl = document.getElementById('checklist');
  cl.innerHTML = '';
  let total = 0, done = 0;
  data.forEach(sec => {
    const wrap = document.createElement('div');
    wrap.className = 'section';
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<span class="section-icon">${sec.icon}</span><span class="section-title">${sec.title}</span><span class="badge ${badgeClass[sec.badge]}">${sec.badgeLabel}</span>`;
    wrap.appendChild(header);
    const tasksDiv = document.createElement('div');
    tasksDiv.className = 'tasks';
    sec.tasks.forEach(t => {
      total++;
      const checked = !!state[t.id];
      if(checked) done++;
      const el = document.createElement('div');
      el.className = 'task' + (checked ? ' done' : '');
      el.innerHTML = `<div class="cb">${checked ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="1.5,6 5,9.5 10.5,2.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>' : ''}</div><div class="task-body"><div class="task-label">${t.label}</div>${t.note ? `<div class="task-note">${t.note}</div>` : ''}</div>`;
      el.onclick = () => { state[t.id] = !state[t.id]; saveState(state); render(); };
      tasksDiv.appendChild(el);
    });
    wrap.appendChild(tasksDiv);
    cl.appendChild(wrap);
  });
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  const pct = Math.round(done / total * 100);
  document.getElementById('pct').textContent = pct + ' %';
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('pct-label').textContent = pct + ' % splněno';
}

render();
</script>
</body>
</html>
